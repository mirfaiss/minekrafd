<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran Usaha MINEKRAFD - Optimized</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script src="data_usaha.js"></script>

    <script>
        // Set titik tengah peta (Saya sesuaikan ke area Sumatera Barat)
        var map = L.map('map').setView([-0.5, 100.5], 8);

        // Menambahkan basemap OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> BPS'
        }).addTo(map);

        // 3. KUNCI OPTIMASI: Membuat wadah (group) khusus untuk cluster
        var markers = L.markerClusterGroup({
            chunkedLoading: true // Membantu memuat data besar secara bertahap agar tidak freeze
        });

        // 4. UBAH LOGIKA LOOPING: Masukkan titik ke dalam 'markers' group, BUKAN langsung ke 'map'
        dataUsaha.forEach(function (usaha) {
            var titik = L.marker([usaha.latitude, usaha.longitude])
                .bindTooltip(usaha.nama_usaha);

            markers.addLayer(titik); // Tambahkan titik ke dalam sistem cluster
        });

        // 5. Masukkan seluruh cluster yang sudah diproses ke dalam peta sekaligus
        map.addLayer(markers);

        fetch('13.08_Pasaman.geojson')
                .then(response => response.json())
                .then(data => {
                    // 2. Buat layer GeoJSON dengan styling
                    var wilayahLayer = L.geoJSON(data, {
                        style: function (feature) {
                            return {
                                color: "#2ecc71",      // Warna garis tepi
                                weight: 2,             // Tebal garis
                                fillColor: "#27ae60",  // Warna area dalam
                                fillOpacity: 0.2       // Transparansi area
                            };
                        },
                        onEachFeature: function (feature, layer) {
                            // Opsional: Tambahkan popup jika area diklik
                            layer.bindPopup("Wilayah: " + (feature.properties.nama || "Pasaman"));
                        }
                    }).addTo(map);

                    // Opsional: Membuat peta otomatis zoom ke area GeoJSON tersebut
                    map.fitBounds(wilayahLayer.getBounds());

                    // Pastikan wilayah berada di bawah titik usaha (Z-index)
                    wilayahLayer.bringToBack();
                })
                .catch(error => console.error('Gagal memuat GeoJSON:', error));
    </script>

</body>

</html>
