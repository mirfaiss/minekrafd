<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minekrafd - Peta Usaha</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        #map {
            z-index: 0;
        }

        .leaflet-popup-content p {
            margin: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="h-screen flex flex-col bg-slate-100 font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-[#FFF0BE] p-4 shadow-md z-10 flex items-center shrink-0">
        <!-- Icon Toko -->
        <div class="bg-white rounded-xl p-2.5 mr-4 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor" class="w-8 h-8 text-[#E87F24]">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" />
            </svg>
        </div>

        <!-- Teks Judul -->
        <div>
            <h1 class="text-[#E87F24] text-4xl font-extrabold tracking-wide drop-shadow-sm">Minekrafd</h1>
            <p class="text-sm text-yellow-900 mt-0.5 font-medium">Mining Data Usaha Ekonomi Kreatif dan Digital</p>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex w-full overflow-hidden">

        <!-- Peta (3/4 Layar) -->
        <div id="map" class="w-3/4 h-full border-r border-slate-300"></div>

        <!-- Sidebar Kanan: Filter, Search & Tabel (1/4 Layar) -->
        <div class="w-1/4 h-full bg-white flex flex-col shadow-lg z-10">

            <!-- Area Filter & Search -->
            <div class="p-4 bg-slate-50 border-b border-slate-200 shrink-0 overflow-y-auto max-h-[50vh]">

                <!-- Search Box -->
                <div class="mb-3">
                    <label for="search-usaha" class="block text-xs font-semibold text-slate-600 mb-1">Cari Nama
                        Usaha:</label>
                    <input type="text" id="search-usaha" placeholder="Ketik nama..."
                        class="w-full border border-slate-300 bg-white rounded-md p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#E87F24]">
                </div>

                <!-- Dropdown Kecamatan -->
                <div class="mb-3">
                    <label for="filter-kecamatan"
                        class="block text-xs font-semibold text-slate-600 mb-1">Kecamatan:</label>
                    <select id="filter-kecamatan"
                        class="w-full border border-slate-300 bg-white rounded-md p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#E87F24]">
                        <option value="all">-- Semua Kecamatan --</option>
                    </select>
                </div>

                <!-- Grid untuk Kategori & Skala agar lebih rapi -->
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <!-- Dropdown Kategori -->
                    <div>
                        <label for="filter-kategori"
                            class="block text-xs font-semibold text-slate-600 mb-1">Kategori:</label>
                        <select id="filter-kategori"
                            class="w-full border border-slate-300 bg-white rounded-md p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#E87F24]">
                            <option value="all">Semua</option>
                        </select>
                    </div>

                    <!-- Dropdown Skala Usaha -->
                    <div>
                        <label for="filter-skala" class="block text-xs font-semibold text-slate-600 mb-1">Skala:</label>
                        <select id="filter-skala"
                            class="w-full border border-slate-300 bg-white rounded-md p-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#E87F24]">
                            <option value="all">Semua</option>
                        </select>
                    </div>
                </div>

                <p class="text-xs text-slate-500 mt-2 text-right">Ditampilkan: <span id="data-count"
                        class="font-bold text-[#E87F24]">0</span> titik</p>
            </div>

            <!-- Area Tabel (Bisa di-scroll) -->
            <div class="flex-1 overflow-y-auto min-h-0 bg-white">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="py-2 px-3 text-xs font-semibold text-slate-600 border-b">Nama Usaha</th>
                            <th class="py-2 px-3 text-xs font-semibold text-slate-600 border-b text-center w-16">Aksi
                            </th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100">
                        <!-- Baris data akan di-generate via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data_usaha.js"></script>

    <script>
        // 1. Inisialisasi Peta
        const map = L.map('map').setView([0.5, 100.1], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const markersLayer = L.layerGroup().addTo(map);

        // 2. Memuat Batas Wilayah GeoJSON
        fetch('Final_Kec_202511309.geojson')
            .then(response => response.json())
            .then(data => {
                const geojsonLayer = L.geoJSON(data, {
                    interactive: false, // <-- SOLUSI EVALUASI 1: Memastikan klik tembus ke titik di bawahnya
                    style: {
                        color: '#E87F24',
                        weight: 2,
                        fillColor: '#FFC81E',
                        fillOpacity: 0.1
                    }
                }).addTo(map);
                map.fitBounds(geojsonLayer.getBounds());
            })
            .catch(error => console.error("Gagal memuat GeoJSON.", error));

        // 3. Menyiapkan Elemen DOM & State
        const selectKecamatan = document.getElementById('filter-kecamatan');
        const selectKategori = document.getElementById('filter-kategori');
        const selectSkala = document.getElementById('filter-skala');
        const searchInput = document.getElementById('search-usaha');

        const tableBody = document.getElementById('table-body');
        const dataCount = document.getElementById('data-count');

        let currentKecamatan = 'all';
        let currentKategori = 'all';
        let currentSkala = 'all';
        let currentSearch = '';

        const markerRefs = {};

        // 4. Mengisi Opsi Filter Secara Dinamis dari data_usaha.js

        // A. Filter Kecamatan
        const uniqueKecamatan = [];
        const seenKdKec = new Set();
        dataKecamatan.forEach(kec => {
            if (!seenKdKec.has(kec.kdkec)) {
                seenKdKec.add(kec.kdkec);
                uniqueKecamatan.push(kec);
            }
        });
        uniqueKecamatan.sort((a, b) => a.nmkec.localeCompare(b.nmkec));
        uniqueKecamatan.forEach(kec => {
            const option = document.createElement('option');
            option.value = kec.kdkec;
            option.textContent = kec.nmkec;
            selectKecamatan.appendChild(option);
        });

        // B. Filter Kategori & Skala (Ekstrak otomatis dari dataUsaha)
        const unikKategori = [...new Set(dataUsaha.map(u => u.kategori).filter(Boolean))].sort();
        const unikSkala = [...new Set(dataUsaha.map(u => u.skala_usaha).filter(Boolean))].sort();

        unikKategori.forEach(kat => {
            const opt = document.createElement('option');
            opt.value = kat;
            opt.textContent = `Kategori ${kat}`;
            selectKategori.appendChild(opt);
        });

        unikSkala.forEach(skala => {
            const opt = document.createElement('option');
            opt.value = skala;
            opt.textContent = skala;
            selectSkala.appendChild(opt);
        });

        // 5. Fungsi Render Marker dan Tabel
        function renderData() {
            markersLayer.clearLayers();
            tableBody.innerHTML = '';
            for (let prop in markerRefs) { delete markerRefs[prop]; }

            let count = 0;

            dataUsaha.forEach((usaha, index) => {
                // Cek kondisi filter
                const matchKecamatan = (currentKecamatan === 'all' || usaha.kdkec === String(currentKecamatan));
                const matchKategori = (currentKategori === 'all' || usaha.kategori === currentKategori);
                const matchSkala = (currentSkala === 'all' || usaha.skala_usaha === currentSkala);
                const matchSearch = usaha.nama_usaha.toLowerCase().includes(currentSearch.toLowerCase());

                // Jika lolos semua filter, tampilkan
                if (matchKecamatan && matchKategori && matchSkala && matchSearch) {

                    const marker = L.circleMarker([usaha.latitude, usaha.longitude], {
                        radius: 6,
                        fillColor: "#3b82f6",
                        color: "#ffffff",
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.8
                    });

                    const infoKec = uniqueKecamatan.find(k => k.kdkec === usaha.kdkec);
                    const namaKecamatan = infoKec ? infoKec.nmkec : 'Tidak diketahui';
                    const katDisplay = usaha.kategori ? `Kategori ${usaha.kategori}` : '-';
                    const skalaDisplay = usaha.skala_usaha ? usaha.skala_usaha : '-';

                    marker.bindPopup(`
                        <div class="text-sm pb-1 border-b mb-1 border-slate-200">
                            <strong class="text-[#E87F24] text-base">${usaha.nama_usaha}</strong>
                        </div>
                        <div class="text-xs text-slate-600 leading-relaxed">
                            Kecamatan: <strong>${namaKecamatan}</strong><br>
                            Kategori: <strong>${katDisplay}</strong><br>
                            Skala Usaha: <strong>${skalaDisplay}</strong><br>
                            <span class="text-[10px] text-slate-400 mt-1 block">${usaha.latitude.toFixed(5)}, ${usaha.longitude.toFixed(5)}</span>
                        </div>
                    `);

                    markersLayer.addLayer(marker);
                    markerRefs[index] = marker;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-orange-50 transition-colors duration-150 border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="py-2.5 px-3">
                            <div class="text-xs text-slate-700 font-bold">${usaha.nama_usaha}</div>
                            <div class="text-[10px] text-slate-500 mt-0.5">Kat: ${katDisplay} | Skala: ${skalaDisplay}</div>
                        </td>
                        <td class="py-2.5 px-3 text-center align-middle">
                            <button onclick="lihatUsaha(${index}, ${usaha.latitude}, ${usaha.longitude})" 
                                    class="text-[10px] bg-slate-100 border border-slate-300 text-slate-700 px-2 py-1 rounded hover:bg-[#FFC81E] hover:text-yellow-900 font-bold transition">
                                Lihat
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(tr);

                    count++;
                }
            });

            dataCount.innerText = count;
        }

        // 6. Fungsi FlyTo dari Tabel
        window.lihatUsaha = function (index, lat, lng) {
            map.flyTo([lat, lng], 17, {
                animate: true,
                duration: 1.5
            });

            setTimeout(() => {
                if (markerRefs[index]) {
                    markerRefs[index].openPopup();
                }
            }, 1000);
        };

        // 7. Event Listeners untuk Semua Filter
        selectKecamatan.addEventListener('change', (e) => { currentKecamatan = e.target.value; renderData(); });
        selectKategori.addEventListener('change', (e) => { currentKategori = e.target.value; renderData(); });
        selectSkala.addEventListener('change', (e) => { currentSkala = e.target.value; renderData(); });
        searchInput.addEventListener('input', (e) => { currentSearch = e.target.value; renderData(); });

        // 8. Render awal
        renderData();
    </script>
</body>

</html>
